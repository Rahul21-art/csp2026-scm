<!DOCTYPE html>
<html>
<head>

<title>Admin Panel</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<div class="text-end p-2">

<button
class="btn btn-success btn-sm"
onclick="changeLanguage('te')">

తెలుగు

</button>

<button
class="btn btn-primary btn-sm"
onclick="changeLanguage('en')">

English

</button>

</div>
<div class="container mt-5">

<h2>Admin Panel</h2>

<hr>
<h3 class="mt-4">Active Complaints:</h3>

<div id="activeComplaints"></div>

<hr>
</button>

<select
id="categorySearch"
class="form-control mb-2">

<option value="">Select Category</option>
<option>Roads</option>
<option>Water Supply</option>
<option>Electricity</option>
<option>Drainage</option>
<option>Sanitation</option>
<option>Street Lights</option>

</select>

<button
class="btn btn-success mb-3"
onclick="searchCategory()">

Search by Category

</button>

<div id="searchResult"></div>
<input
id="complaintId"
class="form-control mb-3"
placeholder="Complaint ID">

<select
id="status"
class="form-control mb-3">

<option>Submitted</option>

<option>Assigned</option>

<option>In Progress</option>

<option>Resolved</option>

</select>

<button
class="btn btn-danger"
onclick="updateStatus()">

Update Status

</button>

</div>

<script>
    function searchComplaint(){

let id =
document.getElementById(
"search"
).value;

let complaint =
JSON.parse(
localStorage.getItem(id)
);

if(complaint){

document.getElementById(
"searchResult"
).innerHTML=`

<div class="card p-3">

${complaint.id}

<br>

${complaint.category}

<br>

${complaint.status}

</div>

`;

}
else{

alert("Not Found");

}

}

function searchCategory(){

    let category =
    document.getElementById(
    "categorySearch"
    ).value;

    let output = "";

    for(let i=0;i<localStorage.length;i++){

        let key =
        localStorage.key(i);

        if(key.startsWith("CMP")){

            let complaint =
            JSON.parse(
            localStorage.getItem(key)
            );

            if(
    complaint.category === category
    &&
    complaint.status !== "Resolved"
){

                output += `

                <div class="card p-3 mb-2">

                    <h5>
                    ${complaint.id}
                    </h5>

                    <p>
                    <b>Category:</b>
                    ${complaint.category}
                    </p>

                    <p>
                    <b>Status:</b>
                    ${complaint.status}
                    </p>

                    <p>
                    <b>Description:</b>
                    ${complaint.description}
                    </p>

                </div>

                `;
            }
        }
    }

    if(output==""){

        output =
        "<h5>No complaints found in this category</h5>";

    }

    document.getElementById(
    "searchResult"
    ).innerHTML = output;
}

function updateStatus(){

let id =
document.getElementById(
"complaintId"
).value;

let complaint =
JSON.parse(
localStorage.getItem(id)
);

if(complaint){

let newStatus =
document.getElementById("status").value;

complaint.status = newStatus;

if(!complaint.timeline){
    complaint.timeline = [];
}

complaint.timeline.push(newStatus);

localStorage.setItem(
id,
JSON.stringify(complaint)
);

alert(
"Status Updated"
);
localStorage.setItem(
"notification",
"Complaint "
+ id +
" updated to "
+ complaint.status
);

}
else{

alert(
"Complaint Not Found"
);

}

}

</script>
<script src="js/language.js"></script>
<script>

window.addEventListener(
"load",
loadActiveComplaints
);

function loadActiveComplaints(){

let output = "";

for(let i=0;i<localStorage.length;i++){

let key = localStorage.key(i);

if(key.startsWith("CMP")){

let complaint =
JSON.parse(
localStorage.getItem(key)
);

if(complaint.status != "Resolved"){
let progress = 25;

if(complaint.status == "Assigned"){
    progress = 50;
}

if(complaint.status == "In Progress"){
    progress = 75;
}

if(complaint.status == "Resolved"){
    progress = 100;
}
output += `
<div
class="card p-3 mb-3 shadow-sm"
style="cursor:pointer"
onclick="showComplaintDetails('${complaint.id}')">

<h5>${complaint.id}</h5>

<p>
<b>Category:</b>
${complaint.category}
</p>

<p>
<b>Place:</b>
${complaint.place || "Not Specified"}
</p>

<p>
<b>Status:</b>
${complaint.status}
</p>
<p><b>Description:</b> ${complaint.description}</p>

<div class="progress mt-2">

<div
class="progress-bar bg-success"
style="width:${progress}%">

${progress}%

</div>

</div>
</div>
`;

}

}

}

if(output==""){
output="<h5>No Active Complaints</h5>";
}

document.getElementById(
"activeComplaints"
).innerHTML = output;

}

function showComplaintDetails(id){

let complaint =
JSON.parse(
localStorage.getItem(id)
);

alert(

"Complaint ID: " + complaint.id +

"\n\nName: " + complaint.name +

"\nEmail: " + complaint.user +

"\nPlace: " + (complaint.place || "Not Specified") +

"\nCategory: " + complaint.category +

"\nStatus: " + complaint.status +

"\n\nDescription:\n" + complaint.description

);

}

</script>
</body>
</html>
