<!DOCTYPE html>
<html>
<head>
<title>Register Complaint</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
    <script>

if(
!localStorage.getItem(
"loggedInUser"
)
){

alert(
"Please Login First"
);

window.location =
"login.html";

}

</script>
<div class="text-end p-2">

<button
class="btn btn-success btn-sm"
onclick="changeLanguage('te')">

తెలుగు

</button>

<button
class="btn btn-primary btn-sm"
onclick="changeLanguage('en')">

English

</button>

</div>
<div
class="card shadow-lg p-4 mt-5 mx-auto"
style="max-width:700px;">

<h2 id="registerComplaintBtn">
Register Complaint
</h2>

<input id="name" class="form-control mb-3" placeholder="Name">

<select id="category" class="form-control mb-3">

<option>🛣 Roads</option>
<option>🚰 Water Supply</option>
<option>⚡ Electricity</option>
<option>💡 Street Lights</option>
<option>🌊 Drainage</option>

</select>

<input
id="place"
class="form-control mb-3"
placeholder="Village / Area / Street">

<textarea
id="description"
class="form-control mb-3"
placeholder="Complaint Description">
</textarea>

<button
class="btn btn-primary"
onclick="submitComplaint()">

Submit Complaint

</button>

</div>

<script>

function submitComplaint(){

    let complaintId =
    "CMP" + Date.now();
    
    for(let i=0;i<localStorage.length;i++){

    let key = localStorage.key(i);

    if(key.startsWith("CMP")){

        let existingComplaint =
        JSON.parse(
        localStorage.getItem(key)
        );

      if(

existingComplaint.place &&
existingComplaint.place.trim().toLowerCase() ==
document.getElementById("place").value.trim().toLowerCase()

&&

existingComplaint.category ==
document.getElementById("category").value

&&

existingComplaint.status != "Resolved"

){

    let copyId = confirm(

        "Complaint Already Registered!\n\n" +

        "Complaint ID: " +

        existingComplaint.id +

        "\n\nStatus: " +

        existingComplaint.status +

        "\n\nPress OK to copy Complaint ID."

    );

    if(copyId){

        navigator.clipboard.writeText(
            existingComplaint.id
        );

        alert(
            "Complaint ID Copied Successfully!"
        );

    }

    return;
}

    }

}

    let complaint = {

        id: complaintId,

        user:
        localStorage.getItem("loggedInUser"),

        name:
        document.getElementById("name").value,

        category:
        document.getElementById("category").value,

        place:
        document.getElementById("place").value,

        description:
        document.getElementById("description").value,

        status:"Submitted",

        date:
        new Date().toLocaleString()

    };

    localStorage.setItem(
        complaintId,
        JSON.stringify(complaint)
    );

    localStorage.setItem(
        "lastComplaint",
        complaintId
    );

    localStorage.setItem(
        "receipt",
        JSON.stringify(complaint)
    );

    let copyId = confirm(
        "Complaint Registered Successfully!\n\nComplaint ID: "
        + complaintId +
        "\n\nPress OK to copy Complaint ID."
    );

    if(copyId){

        navigator.clipboard.writeText(
            complaintId
        );

        alert(
            "Complaint ID Copied Successfully!"
        );

    }

    window.open(
        "receipt.html"
    );

}
</script>
<script src="js/language.js"></script>
</body>
</html>
