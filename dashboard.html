<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="text-end p-2">

<button
class="btn btn-success btn-sm"
onclick="changeLanguage('te')">

తెలుగు

</button>

<button
class="btn btn-primary btn-sm"
onclick="changeLanguage('en')">

English

</button>

</div>
    <div class="container mt-5">

<h2 id="dashboardTitle">
User Dashboard
</h2>
<div
class="card shadow border-0 p-3 mb-4">

<h4>
<i class="fa-solid fa-user"></i>
My Profile
</h4>

<p>
<b>Name:</b>
<span id="profileName"></span>
</p>

<p>
<b>Email:</b>
<span id="profileEmail"></span>
</p>

<p>
<b>Mobile:</b>
<span id="profileMobile"></span>
</p>

</div>
<div class="card welcome-card shadow border-0 p-4 mb-4">

    <h3>
        Welcome,
        <span id="userName"></span>
    </h3>

    <p>
        Track your complaints here and stay updated.
    </p>

</div>

<div
id="notification"
class="alert alert-info mt-3">
No Notifications
</div>
<div class="row">

    <div class="col-md-4">
        <div class="card stat-card p-3 text-center" onclick="showComplaints('all')" style="cursor:pointer;">
            <h3 id="total">1</h3>
            <p id="totalText">
<i class="fa-solid fa-file-circle-exclamation"></i>
Total Complaints
</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card stat-card p-3 text-center" onclick="showComplaints('active')" style="cursor:pointer;">
            <h3 id="active">0</h3>
            <p id="activeText">
<i class="fa-solid fa-spinner"></i>
Active Complaints
</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card stat-card p-3 text-center" onclick="showComplaints('resolved')" style="cursor:pointer;">
            <h3 id="resolved">1</h3>
            <p id="resolvedText">
<i class="fa-solid fa-circle-check"></i>
Resolved Complaints
</p>
        </div>
    </div>

</div>

<hr>

<div id="complaintList"></div>
<h3 class="mt-4">
My Complaints
</h3>

<div id="history"></div>

<br>

<a
href="complaint.html"
class="btn btn-primary">

Register Complaint

</a>

<a
href="track.html"
class="btn btn-success">

Track Complaint

</a>

</div>
<script>

function updateDashboardCounts(){
    let user =
JSON.parse(
localStorage.getItem("user")
);

document.getElementById(
"profileName"
).innerHTML = user.name;

document.getElementById(
"profileEmail"
).innerHTML = user.email;

document.getElementById(
"profileMobile"
).innerHTML = user.mobile;
    document.getElementById(
"userName"
).innerHTML =
localStorage.getItem(
"loggedInUserName"
);

    document.getElementById(
    "notification"
    ).innerHTML =

    localStorage.getItem(
    "notification"
    ) || "No Notifications";

    let total = 0;
    let active = 0;
    let resolved = 0;

    for(let i=0;i<localStorage.length;i++){

        let key = localStorage.key(i);

        if(key.startsWith("CMP")){

    let complaint =
    JSON.parse(localStorage.getItem(key));

    if(
        complaint.user ==
        localStorage.getItem("loggedInUser")
    ){

        total++;

        if(complaint.status=="Resolved"){
            resolved++;
        }
        else{
            active++;
        }

    }
}
    }

    animateCounter("total", total);
animateCounter("active", active);
animateCounter("resolved", resolved);
}
function animateCounter(id,target){

let count = 0;

let interval = setInterval(function(){

count++;

document.getElementById(id).innerHTML =
count;

if(count >= target){

clearInterval(interval);

}

},50);

}
window.addEventListener(
"load",
updateDashboardCounts
);

</script>
<script>



</script>
<script>

function showComplaints(type){

    let output = "";

    for(let i = 0; i < localStorage.length; i++){

        let key = localStorage.key(i);

        if(key.startsWith("CMP")){

            let complaint =
            JSON.parse(localStorage.getItem(key));

            if(

    complaint.user ==
    localStorage.getItem("loggedInUser")

    &&

    (

        type == "all"

        ||

        (
            type == "active"
            &&
            complaint.status != "Resolved"
        )

        ||

        (
            type == "resolved"
            &&
            complaint.status == "Resolved"
        )

    )

){
let progress = 25;

if(complaint.status == "Assigned"){
    progress = 50;
}

if(complaint.status == "In Progress"){
    progress = 75;
}

if(complaint.status == "Resolved"){
    progress = 100;
}
                output += `
                <div class="card shadow-sm border-0 p-3 mb-3">
                    <h5>${complaint.id}</h5>
                    <p><b>Category:</b> ${complaint.category}</p>
                    <p><b>Status:</b> ${complaint.status}</p>
                    <p><b>Description:</b> ${complaint.description}</p>

<div class="progress mt-2">

<div
class="progress-bar bg-success"
style="width:${progress}%">

${progress}%

</div>

</div>
                </div>
                `;
            }
        }
    }

    if(output == ""){
        output = "<h5>No complaints found</h5>";
    }

    document.getElementById("complaintList").innerHTML =
    output;
}

</script>
<script>

window.addEventListener(
"load",
loadHistory
);

function loadHistory(){

let output="";

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(key.startsWith("CMP")){

let complaint=
JSON.parse(
localStorage.getItem(key)
);

if(
    complaint.user ==
    localStorage.getItem("loggedInUser")
){

output += `
<div class="card p-3 mb-2">

<b>${complaint.id}</b>

<br>

${complaint.category}

<br>

${complaint.status}

</div>
`;

}


}

}

document.getElementById(
"history"
).innerHTML=output;

}

</script>
<script src="js/language.js"></script>
</body>
</html>
