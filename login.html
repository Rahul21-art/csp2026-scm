<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.login-page{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* BIG BOX */
.login-card{
    width: 100%;
    max-width: 550px;
    border-radius: 12px;
}

/* 📱 MOBILE: force bigger feel */
@media (max-width: 576px){
    .login-card{
        max-width: 100%;   /* take full width */
        width: 100%;
        margin: 0 10px;    /* small side breathing space */
    }

    .login-page{
        padding: 10px;
    }
}
</style>
</head>
<body class="bg-light">

<div class="login-page">

    <div class="card login-card p-4">

        <h2 class="text-center mb-4">Login</h2>

        <input id="email" class="form-control mb-3" placeholder="Email">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-success w-100" onclick="loginUser()">
            Login
        </button>

    </div>

    <div class="mt-3 text-center">
        Please register if you don't have an account.
        <a href="register.html">Register Here</a>
    </div>

</div>

</body>
</html>
