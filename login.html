<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="page">

    <div class="card login-card">

        <h2 class="text-center mb-4">Login</h2>

        <input id="email" class="form-control mb-3" placeholder="Email">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">

        <button
class="btn btn-success w-100"
onclick="loginUser()">
Login
</button>

    </div>

    <div class="mt-3 text-center">
        Please register if you don't have an account.
        <a href="register.html">Register Here</a>
    </div>

</div>

<style>
/* FULL CONTROL */
body{
    margin: 0;
}

/* CENTER + FULL WIDTH CONTROL */
.page{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0;
}

/* BIG CARD */
.login-card{
    width: 92vw;          /* 🔥 IMPORTANT: uses 92% of screen width */
    max-width: 550px;     /* desktop limit */
    padding: 25px;
    border-radius: 12px;
}

/* 📱 MOBILE: FORCE BIG FEEL */
@media (max-width: 576px){
    .login-card{
        width: 95vw;      /* almost full screen */
        max-width: 95vw;
        padding: 20px;
        border-radius: 10px;
    }
}
</style>
<script>
function loginUser(){

    let email =
    document.getElementById("email").value.trim();

    let password =
    document.getElementById("password").value.trim();

    // Admin Login
    if(
        email === "scm2026@gmail.com" &&
        password === "admin1421"
    ){
        window.location = "admin.html";
        return;
    }

    // Normal User Login
    let user =
    JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("No user registered");
        return;
    }
        if(
    email === user.email &&
    password === user.password
){

    localStorage.setItem(
    "loggedInUser",
    user.email
);

window.location = "index.html";
}
    else{
        alert("Invalid Email or Password");
    }
}
</script>
</body>
</html>
