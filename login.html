<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="d-flex flex-column align-items-center">

    <div class="card login-card p-4" style="max-width:450px;width:100%;">
        <h2 class="text-center mb-4">Login</h2>

        <input id="email" class="form-control mb-3" placeholder="Email">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-success" onclick="loginUser()">
            Login
        </button>
    </div>

    <!-- 👇 moved below card -->
    <div class="mt-3 text-center">
        Please register if you don't have an account.
        <a href="register.html">Register Here</a>
    </div>

</div>
</body>
</html>
