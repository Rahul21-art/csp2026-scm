<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body
class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div
class="card login-card p-4"
style="max-width:450px;width:100%;">

<h2
class="text-center mb-4"
id="loginBtn">
Login
</h2>

<input id="email" class="form-control mb-3" placeholder="Email">

<input id="password" type="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-success" onclick="loginUser()">
Login
</button>

</div>
<br><br>
    <br>
<div>
    please register if you don't have an account. <a href="register.html">Register Here</a></>
</div>

<script>

function loginUser(){

let emailValue =
document.getElementById("email").value;

let passwordValue =
document.getElementById("password").value;

// ADMIN CHECK FIRST
if(emailValue === "scm2026@gmail.com" && passwordValue === "admin1421"){

localStorage.setItem("adminLoggedIn","true");

window.location = "admin.html";

return;
}

// NORMAL USER CHECK
let user =
JSON.parse(localStorage.getItem("user"));

if(!user){
alert("No user registered");
return;
}

if(
email.value == user.email &&
password.value == user.password
){

localStorage.setItem(
"loggedInUser",
user.email
);

console.log(user);

localStorage.setItem(
"loggedInUserName",
user.name
);

alert("Login Successful");

window.location =
"dashboard.html";

}
else{
alert("Invalid Credentials");
}

}

</script>
<script src="js/language.js"></script>
</body>
</html>
