<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.login-card{
    width: 100%;
    max-width: 500px;
}

/* 📱 Mobile fix */
@media (max-width: 576px){
    .login-card{
        max-width: 100%;
        width: 100%;
        border-radius: 0;
        height: auto;
    }

    .container > div{
        padding: 15px;
    }
}
</style>
</head>
<body class="bg-light">

<div class="login-page">

    <div class="login-wrapper">

        <div class="card login-card p-4">
            <h2 class="text-center mb-4">Login</h2>

            <input id="email" class="form-control mb-3" placeholder="Email">
            <input id="password" type="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-success w-100" onclick="loginUser()">
                Login
            </button>
        </div>

        <div class="mt-3 text-center">
            Please register if you don't have an account.
            <a href="register.html">Register Here</a>
        </div>

    </div>

</div>

<style>
/* FULL CONTROL LAYOUT */
.login-page{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;   /* 🔥 removes big vertical gap */
    padding-top: 40px;
}

/* wrapper controls width */
.login-wrapper{
    width: 100%;
    max-width: 480px;
    padding: 10px;
}

/* card */
.login-card{
    width: 100%;
    border-radius: 12px;
}

/* 📱 MOBILE FIX */
@media (max-width: 576px){

    .login-page{
        padding-top: 10px;   /* 🔥 very small top space */
    }

    .login-wrapper{
        padding: 5px;        /* 🔥 minimal side space */
        max-width: 100%;
    }

    .login-card{
        border-radius: 10px;
    }
}
</style>

</body>
</html>
