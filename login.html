<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.login-card{
    width: 100%;
    max-width: 500px;
}

/* 📱 Mobile fix */
@media (max-width: 576px){
    .login-card{
        max-width: 100%;
        width: 100%;
        border-radius: 0;
        height: auto;
    }

    .container > div{
        padding: 15px;
    }
}
</style>
</head>
<body class="bg-light">

<div class="d-flex justify-content-center align-items-center min-vh-100">

    <div class="w-100 login-wrapper">

        <div class="card login-card p-4">
            <h2 class="text-center mb-4">Login</h2>

            <input id="email" class="form-control mb-3" placeholder="Email">
            <input id="password" type="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-success w-100" onclick="loginUser()">
                Login
            </button>
        </div>

        <div class="mt-3 text-center">
            Please register if you don't have an account.
            <a href="register.html">Register Here</a>
        </div>

    </div>

</div>

<style>
.login-wrapper{
    max-width: 480px;
    width: 100%;
}

/* 📱 MOBILE: reduce spacing heavily */
@media (max-width: 576px){
    .login-wrapper{
        max-width: 100%;
        padding: 8px;   /* 🔥 very small edge space */
    }

    .login-card{
        border-radius: 10px;
    }

    body{
        margin: 0;
    }
}
</style>

</body>
</html>
